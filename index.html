<title>Alagoas: Arte que Encanta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Conceito: o tabuleiro físico levado para a tela. Fundo areia, azul-marinho
   do letreiro, vermelho do hibisco, turquesa da lagoa e amarelo do sol. */
:root {
  --bg: #F6E7C9;
  --glow-a: rgba(63, 208, 201, .28);
  --glow-b: rgba(247, 197, 49, .30);
  --surface: #FFF8EA;
  --surface-2: #FBEBCB;
  --fg: #14264F;
  --muted: #55607A;
  --line: #E2CB9C;
  --primary: #14264F;
  --on-primary: #FFFFFF;
  --red: #C8283A;
  --sun: #F7C531;
  --on-sun: #2A1B00;
  --sea: #1B86C8;
  --ok: #1F7A3E;
  --no: #B3261E;
  --focus: #0B5FFF;
  --overlay: rgba(10, 20, 45, .66);
  --shadow: 0 10px 30px rgba(20, 38, 79, .18);
  --f-display: "Lobster", "Brush Script MT", cursive;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glow-a: rgba(47, 177, 219, .16); --glow-b: rgba(247, 197, 49, .08);
    --bg: #0C1731; --surface: #15264D; --surface-2: #1D3262; --fg: #F6EBD3; --muted: #B8C2DA;
    --line: #2E4780; --primary: #F7C531; --on-primary: #2A1B00; --red: #FF6B78; --sun: #F7C531;
    --on-sun: #2A1B00; --sea: #5FC0F2; --ok: #54C47F; --no: #FF8A80; --focus: #8DB4FF;
    --overlay: rgba(2, 6, 18, .78); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --glow-a: rgba(47, 177, 219, .16); --glow-b: rgba(247, 197, 49, .08);
  --bg: #0C1731; --surface: #15264D; --surface-2: #1D3262; --fg: #F6EBD3; --muted: #B8C2DA;
  --line: #2E4780; --primary: #F7C531; --on-primary: #2A1B00; --red: #FF6B78; --sun: #F7C531;
  --on-sun: #2A1B00; --sea: #5FC0F2; --ok: #54C47F; --no: #FF8A80; --focus: #8DB4FF;
  --overlay: rgba(2, 6, 18, .78); --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--bg); color: var(--fg);
  background-image: radial-gradient(900px 460px at 12% -6%, var(--glow-a), transparent 70%), radial-gradient(760px 420px at 100% 0%, var(--glow-b), transparent 70%);
  background-attachment: fixed;
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
body.noscroll { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.wrap { max-width: 1280px; margin: 0 auto; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em; text-align: center;
  min-height: 50px; padding: 10px 20px; border-radius: 14px; border: 2.5px solid var(--fg);
  background: var(--surface); font-weight: 800; line-height: 1.2;
  transition: transform .12s ease, box-shadow .12s ease;
  box-shadow: 0 3px 0 var(--fg);
}
.btn small { font-weight: 600; opacity: .85; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--fg); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-sun { background: var(--sun); color: var(--on-sun); border-color: #8A5A00; box-shadow: 0 3px 0 #8A5A00; }
.btn-ghost { background: var(--surface); color: var(--fg); }
.btn-ok { background: var(--ok); color: #fff; border-color: #0F4A24; box-shadow: 0 3px 0 #0F4A24; }
.btn-no { background: var(--no); color: #fff; border-color: #6E140F; box-shadow: 0 3px 0 #6E140F; }
:root[data-theme="dark"] .btn-ok, :root[data-theme="dark"] .btn-no { color: #0B1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-ok, :root:not([data-theme="light"]) .btn-no { color: #0B1020; } }
.btn-xl { min-height: 58px; font-size: 19px; padding-inline: 26px; }
.btn-sm { min-height: 44px; padding: 6px 14px; font-size: 15px; }

.panel { background: linear-gradient(180deg, var(--surface), var(--surface-2)); border: 2.5px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow), inset 0 2px 0 rgba(255, 255, 255, .55); min-width: 0; }
.panel h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

/* ---------- início ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: center; min-height: calc(100dvh - 60px); }
.home-art img { display: block; width: 100%; height: auto; border-radius: 18px; box-shadow: var(--shadow); border: 3px solid var(--sun); }
.home-text { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.home h1 { display: flex; flex-direction: column; font-family: var(--f-display); font-weight: 400; line-height: .98; }
.h1-a { font-size: clamp(64px, 9vw, 118px); color: var(--fg); }
.h1-b { font-size: clamp(32px, 4.4vw, 58px); color: var(--red); margin-top: 2px; }
.lead { font-family: var(--f-display); font-size: clamp(22px, 2.6vw, 30px); color: var(--fg); }
.sub { color: var(--muted); max-width: 46ch; }
.cat-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--cat); color: var(--cat-fg); font-weight: 800; font-size: 14px; border: 2px solid var(--cat-dark); }
.home-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 6px; }
.home-actions .btn-xl:first-child { grid-column: 1 / -1; }

/* ---------- configuração ---------- */
.setup { max-width: 760px; display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.back { align-self: flex-start; background: none; border: 0; font-weight: 800; color: var(--fg); padding: 10px 4px; min-height: 44px; }
.page-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(36px, 6vw, 52px); }
.setup .panel { display: flex; flex-direction: column; gap: 20px; }
.seg-wrap { border: 0; padding: 0; margin: 0; }
.seg-wrap legend { font-weight: 800; margin-bottom: 8px; padding: 0; }
.seg { display: flex; gap: 10px; }
.seg-btn { flex: 1; min-height: 56px; border-radius: 14px; border: 2.5px solid var(--fg); background: var(--surface); font-size: 22px; font-weight: 800; }
.seg-btn.on { background: var(--primary); color: var(--on-primary); }
.plist { display: flex; flex-direction: column; gap: 18px; }
.prow { display: grid; gap: 8px; padding-bottom: 18px; border-bottom: 2px dashed var(--line); }
.prow:last-child { border-bottom: 0; padding-bottom: 0; }
.plabel, .flabel { font-weight: 800; font-size: 15px; }
.input { width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2.5px solid var(--fg); background: var(--surface); color: var(--fg); font-size: 18px; }
.pawns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pawn-pick { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 64px; padding: 6px 2px; border-radius: 14px; border: 2.5px solid var(--line); background: var(--surface-2); }
.pawn-pick span { font-size: 26px; line-height: 1.1; }
.pawn-pick small { font-size: 12px; font-weight: 700; }
.pawn-pick.on { border-color: var(--fg); background: var(--c); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--c); color: #fff; }
.pawn-pick[disabled] { opacity: .35; cursor: not-allowed; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 700; min-height: 44px; }
.check input { width: 24px; height: 24px; accent-color: var(--red); }

/* ---------- jogo ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-family: var(--f-display); }
.brand-a { font-size: 38px; color: var(--fg); text-shadow: 0 2px 0 rgba(255, 255, 255, .5); }
.brand-b { font-size: 20px; color: var(--red); }
.top-actions { display: flex; gap: 8px; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
.board-col { min-width: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.board-box { width: 100%; max-width: min(100%, calc(100dvh - 150px)); aspect-ratio: 1; border-radius: 38px; box-shadow: 0 18px 40px rgba(20, 38, 79, .3); }
.board-box svg { display: block; width: 100%; height: 100%; }
.board-box text { user-select: none; }
.pawn { transition: transform .22s ease-in-out; }
.pawn .pring { opacity: 0; }
.pawn.ativo .pring { opacity: 1; animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(1.2deg); } }
@keyframes shimmer { 0%, 100% { opacity: .25; } 50% { opacity: .85; } }
@keyframes ping { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
.sunrays { animation: spin 90s linear infinite; transform-box: fill-box; transform-origin: center; }
.bob { animation: bob 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.wv { animation: shimmer 3.4s ease-in-out infinite; }
#hl { transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
.tile { transition: filter .2s; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800; }
.legend li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--cat); color: var(--cat-fg); }
.legend li.lg-special { background: var(--surface); color: var(--fg); border: 2px solid var(--line); padding-block: 2px; }
.lg { font-style: normal; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, .85); }
.lg-s { background: #14264F; } .lg-o { background: #E0457B; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.turn { border-top: 6px solid var(--sun); }
.turn-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
.turn h2 { font-size: 26px; line-height: 1.1; overflow-wrap: anywhere; }
.avatar { flex: none; display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--c); font-size: 28px; }
.avatar.sm { width: 38px; height: 38px; font-size: 20px; border-width: 2.5px; }
.hint { color: var(--muted); font-weight: 700; margin-bottom: 10px; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cat-btn { font-size: 16px; display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 8px 12px; border-radius: 16px; background: var(--cat); color: var(--cat-fg); border: 3px solid var(--cat-dark); font-weight: 800; text-align: left; box-shadow: 0 4px 0 var(--cat-dark); transition: transform .12s; }
.cat-btn:hover:not([disabled]) { transform: translateY(-2px); }
.cat-btn:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 var(--cat-dark); }
.cat-btn[disabled] { opacity: .45; cursor: not-allowed; }
.cat-btn .ic { font-size: 30px; line-height: 1; }
.cat-btn .tx { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.cat-btn small { font-size: 11px; font-weight: 700; opacity: .9; }

.plist2 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pl { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; border: 2.5px solid transparent; }
.pl.on { border-color: var(--sun); background: var(--surface-2); }
.pl-main { flex: 1; min-width: 0; }
.pl-name { font-weight: 800; overflow-wrap: anywhere; }
.tag { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); border: 1.5px solid var(--line); vertical-align: middle; }
.tag.on { background: var(--sun); color: var(--on-sun); border-color: #8A5A00; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1.5px solid var(--line); overflow: hidden; margin: 4px 0; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sea), #3FD0C9); transition: width .4s; }
.pl-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 700; }
.streak { display: inline-flex; gap: 4px; }
.dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--muted); display: inline-block; }
.dot.on { background: var(--sun); border-color: #8A5A00; }
.log { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.log li:first-child { font-weight: 800; }

/* ---------- modais ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: grid; place-items: center; overflow-y: auto;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 520px; max-height: calc(100dvh - 24px); overflow-y: auto; background: var(--surface); color: var(--fg); border-radius: 22px; border: 3px solid var(--fg); box-shadow: var(--shadow); animation: pop .22s ease; outline: 0; }
.sheet-card { max-width: 660px; border: 0; background: transparent; box-shadow: none; overflow: visible; }
@keyframes pop { from { transform: translateY(12px) scale(.97); opacity: 0; } }
.info, .result, .text-modal, .win { padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: stretch; }
.info .big, .result .big { font-size: 56px; line-height: 1; }
.info h2, .result h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; }
.info.gold h2 { color: var(--red); }
.note { font-size: 14.5px; color: var(--muted); }
.desafio { display: inline-block; margin-top: 8px; font-size: 22px; font-weight: 800; color: var(--red); }
.choices { display: grid; gap: 10px; }
.result.ok h2 { color: var(--ok); } .result.no h2 { color: var(--no); }
.answer { text-align: left; background: var(--surface-2); border: 2.5px dashed var(--cat, var(--line)); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.answer span { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.answer strong { font-size: 22px; line-height: 1.25; }

.card { background: var(--surface); border-radius: 22px; border: 4px solid var(--cat); box-shadow: var(--shadow); overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--cat); color: var(--cat-fg); flex-wrap: wrap; }
.card-head .ic { font-size: 34px; line-height: 1; background: rgba(255, 255, 255, .9); width: 54px; height: 54px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.card-head .ct { flex: 1; min-width: 140px; }
.cat-name { font-family: var(--f-display); font-size: 26px; line-height: 1.05; }
.card-sub { font-size: 13px; font-weight: 700; opacity: .95; }
.prize { text-align: center; background: var(--surface); color: var(--fg); border-radius: 12px; padding: 4px 12px; line-height: 1.1; min-width: 96px; border: 2px solid var(--cat-dark); }
.prize small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.prize b { font-size: 20px; }
.card-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.question { font-size: clamp(22px, 4.4vw, 28px); line-height: 1.25; font-weight: 800; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps li { display: flex; flex-direction: column; align-items: center; padding: 4px; border-radius: 10px; border: 2px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); }
.steps li b { font-size: 18px; color: var(--fg); }
.steps li.on { background: var(--sun); border-color: #8A5A00; color: var(--on-sun); }
.steps li.on b { color: var(--on-sun); }
.steps li.past { opacity: .45; text-decoration: line-through; }
.hintbox { background: var(--surface-2); border-left: 6px solid var(--sun); border-radius: 8px 14px 14px 8px; padding: 10px 14px; font-weight: 700; }
.hintbox span { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.row-actions .btn { flex: 1 1 200px; }
.said { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.said q { font-style: italic; font-weight: 800; }
.judge { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 2.5px dashed var(--line); }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.steal { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 2.5px solid var(--red); }
.steal .big { font-size: 40px; }

.text-modal { text-align: left; }
.text-modal h2 { font-family: var(--f-display); font-weight: 400; font-size: 36px; }
.text-modal h3 { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--red); margin-top: 6px; }
.lead2 { font-weight: 700; }
.rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.table { display: grid; gap: 6px; }
.table div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.quote { font-family: var(--f-display); font-size: 26px; color: var(--red); text-align: center; }
.sheet-text { max-width: 640px; }

.sheet-win { max-width: 560px; position: relative; overflow: hidden; }
.win { position: relative; align-items: center; }
.trophy { font-size: 84px; line-height: 1; animation: bounce 1.2s ease infinite; }
@keyframes bounce { 50% { transform: translateY(-10px) rotate(-4deg); } }
.win-name { font-family: var(--f-display); font-weight: 400; font-size: clamp(36px, 8vw, 52px); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; overflow-wrap: anywhere; }
.win-msg { font-size: 20px; font-weight: 700; max-width: 30ch; }
.win .choices { width: 100%; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -14px; left: var(--x); width: 10px; height: 16px; background: var(--c); border-radius: 2px; animation: fall var(--s) linear var(--d) infinite; }
@keyframes fall { to { transform: translateY(640px) rotate(560deg); } }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--primary); color: var(--on-primary); font-weight: 800; padding: 12px 20px; border-radius: 999px; box-shadow: var(--shadow); animation: fade .2s ease; max-width: calc(100vw - 32px); text-align: center; }

/* ---------- telas menores ---------- */
@media (max-width: 960px) {
  .home { grid-template-columns: 1fr; gap: 20px; min-height: 0; }
  .game { grid-template-columns: 1fr; }
  .board-box { max-width: min(100%, 720px); }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  .brand-a { font-size: 28px; }
  .cats { gap: 8px; }
  .cat-btn { min-height: 60px; padding: 6px 10px; }
  .cat-btn { font-size: 15px; gap: 8px; }
  .cat-btn .ic { font-size: 24px; }
  .verdict { grid-template-columns: 1fr; }
  .home-actions { grid-template-columns: 1fr; }
  .pawn-pick small { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- online ---------- */
.callout { background: var(--surface-2); border-left: 6px solid var(--sea); border-radius: 8px 14px 14px 8px; padding: 10px 14px; font-weight: 600; }
.seg-btn.wide { font-size: 17px; }
.err { color: var(--no); font-weight: 800; }
.wait { text-align: center; font-weight: 800; color: var(--muted); padding: 10px; border: 2.5px dashed var(--line); border-radius: 14px; }
.small { font-size: 14px; }
.sub-h { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.codebox { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; border-radius: 16px; background: var(--surface-2); border: 3px dashed var(--sun); text-align: center; }
.code { font-family: var(--f-display); font-weight: 400; font-size: clamp(48px, 14vw, 76px); letter-spacing: .12em; line-height: 1; color: var(--red); user-select: all; }
.code-input { text-transform: uppercase; letter-spacing: .2em; font-weight: 800; text-align: center; }
.roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.roster li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: var(--surface-2); border: 2px solid var(--line); }
.rn { font-weight: 800; overflow-wrap: anywhere; }
.room-badge { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--sun); color: var(--on-sun); font-weight: 900; letter-spacing: .04em; border: 2.5px solid #8A5A00; }
.tents { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
.tents q { font-style: italic; }
.home-actions .btn-xl { font-size: 18px; }

/* ============================================================
   MOTOR DO JOGO — lógica pura (sem DOM).
   Todo o estado fica em um objeto serializável, o que deixa o
   caminho pronto para multiplayer online no futuro: bastará
   sincronizar esse objeto (ou as ações) entre os participantes.
   ============================================================ */
(function () {
  const A = (window.ALAGOAS = window.ALAGOAS || {});
  const C = A.CONFIG;
  const CARTAS = A.CARTAS;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* Percurso: início + 40 casas de categoria (10 de cada, alternadas)
     + casas especiais intercaladas + chegada. */
  function buildPath() {
    const path = [{ tipo: "inicio" }];
    const ordem = C.ORDEM_CATEGORIAS;
    for (let k = 1; k <= 40; k++) {
      path.push({ tipo: "cat", cat: ordem[(k - 1) % ordem.length] });
      if (C.ESPECIAIS.surpresa.includes(k)) path.push({ tipo: "surpresa" });
      if (C.ESPECIAIS.orgulho.includes(k)) path.push({ tipo: "orgulho" });
    }
    path.push({ tipo: "chegada" });
    path.forEach((t, i) => (t.i = i));
    return path;
  }

  function newDecks() {
    const decks = {};
    C.ORDEM_CATEGORIAS.forEach((cat) => {
      decks[cat] = { ordem: shuffle(CARTAS[cat].map((_, i) => i)), i: 0 };
    });
    return decks;
  }

  function newGame(players, sortear) {
    let list = players.map((p) => ({ nome: p.nome, peao: p.peao, pos: 0, streak: 0, skip: 0 }));
    if (sortear) list = shuffle(list);
    return {
      v: 1,
      players: list,
      turn: 0,
      rodada: 1,
      extra: false,
      decks: newDecks(),
      log: [],
      winner: null
    };
  }

  /* Sorteia a próxima carta da categoria, sem repetir até acabar o baralho. */
  function draw(state, cat) {
    const d = state.decks[cat];
    if (d.i >= d.ordem.length) {
      d.ordem = shuffle(d.ordem);
      d.i = 0;
    }
    const idx = d.ordem[d.i++];
    return { cat, idx };
  }

  function avanco(dicasUsadas) {
    return C.AVANCO_POR_DICAS[Math.min(dicasUsadas, C.AVANCO_POR_DICAS.length - 1)];
  }

  /* Resolve um movimento. Pelo manual, quem alcança ou ultrapassa a
     última casa vence (não precisa chegar exatamente). */
  function resolve(pos, delta, last) {
    let alvo = pos + delta;
    if (alvo < 0) alvo = 0;
    if (alvo > last) alvo = last;
    return { alvo, bloqueado: false };
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  A.Engine = { shuffle, buildPath, newDecks, newGame, draw, avanco, resolve, pick };
})();

/* ============================================================
   REGRAS COMO MÁQUINA DE ESTADOS (sem DOM)
   Um único "reducer" serve ao modo local e ao online: o anfitrião
   (ou o aparelho, no modo local) aplica as ações e publica o estado;
   os demais só enviam ações e desenham o estado recebido.

   S  = estado público (vai para todos, cabe em ~3 KB)
   D  = estado privado do anfitrião (baralhos)
   ============================================================ */
(function () {
  const A = (window.ALAGOAS = window.ALAGOAS || {});
  const C = A.CONFIG, E = A.Engine, CARTAS = A.CARTAS;
  const PATH = E.buildPath();
  const LAST = PATH.length - 1;

  function setPh(S, ph) { ph.id = ++S.pc; S.ph = ph; return ph; }
  function log(S, t) {
    S.lg.unshift(String(t).slice(0, 80));
    if (S.lg.length > 7) S.lg.length = 7;
  }

  /* players: [{n: nome, p: peão, u: id do aparelho}] */
  function create(players, opts) {
    opts = opts || {};
    let pl = players.map((p) => ({ n: p.n, p: p.p, u: p.u || "", x: 0, k: 0, s: 0 }));
    if (opts.sortear) pl = E.shuffle(pl);
    const S = { v: 2, g: Math.random().toString(36).slice(2, 8), ver: 0, pc: 0, mode: opts.mode || "local", med: !!opts.med, pl, t: 0, r: 1, ex: false, exp: false, lg: [], ph: null };
    setPh(S, { k: "esc" });
    return { S, D: { decks: E.newDecks() } };
  }

  /* ---------- movimento e fim de jogada ---------- */
  function endTurn(S) {
    if (S.ex) {
      S.ex = false; S.exp = true;
      log(S, `${S.pl[S.t].n} joga de novo (pergunta extra).`);
      setPh(S, { k: "esc" });
      return;
    }
    S.t = (S.t + 1) % S.pl.length;
    if (S.t === 0) S.r++;
    const p = S.pl[S.t];
    if (p.s > 0) {
      p.s--;
      log(S, `${p.n} perdeu a rodada.`);
      setPh(S, { k: "skp", i: S.t });
    } else setPh(S, { k: "esc" });
  }

  /* Executa as operações pendentes. m = mover, l = checar casa especial,
     s = perder rodada, x = pergunta extra. */
  function runOps(S, ops) {
    for (const op of ops) {
      if (op.o === "m") {
        const p = S.pl[op.i];
        p.x = Math.max(0, Math.min(LAST, p.x + op.d));
        if (p.x === LAST && op.d > 0) {
          log(S, `${p.n} venceu a partida!`);
          setPh(S, { k: "fim", w: op.i });
          return true;
        }
      } else if (op.o === "s") S.pl[op.i].s = 1;
      else if (op.o === "x") S.ex = true;
      else if (op.o === "l") {
        const t = PATH[S.pl[op.i].x];
        const p = S.pl[op.i];
        if (t.tipo === "surpresa") {
          const s = E.pick(C.SURPRESAS);
          log(S, `${p.n} caiu na Casa Surpresa: ${s.titulo}`);
          setPh(S, { k: "sup", sid: s.id, i: op.i });
          return true;
        }
        if (t.tipo === "orgulho") {
          log(S, `${p.n} caiu em Orgulho de ser alagoano.`);
          setPh(S, { k: "org", i: op.i, ds: E.pick(C.DESAFIOS_ORGULHO) });
          return true;
        }
      }
    }
    endTurn(S);
    return true;
  }

  function res(S, ok, ph, ti, li, pe, extra) {
    const r = { k: "res", ok, ti, li, pe };
    if (ph && ph.cat) { r.cat = ph.cat; r.idx = ph.idx; }
    if (extra) Object.assign(r, extra);
    setPh(S, r);
  }

  function judge(S, ph, ok) {
    const p = S.pl[S.t];
    const cfg = C.CATEGORIAS[ph.cat];
    if (ph.md === "a") {
      const q = S.pl[ph.q];
      if (ok) {
        log(S, `${q.n} respondeu certo à pergunta de ${p.n}.`);
        res(S, true, ph, "Mandou bem!", [`${q.n} acertou e não sofre nenhuma penalidade.`], []);
      } else {
        log(S, `${q.n} errou a pergunta de ${p.n} e volta ${C.ADVERSARIO_ERRA_VOLTA} casas.`);
        res(S, false, ph, "Não foi dessa vez", [`${q.n} volta ${C.ADVERSARIO_ERRA_VOLTA} casas.`], [{ o: "m", i: ph.q, d: -C.ADVERSARIO_ERRA_VOLTA }]);
      }
      return true;
    }
    if (ok) {
      const casas = ph.md === "x" ? C.EXTRA_AVANCO : E.avanco(ph.d);
      p.k = ph.d === 0 ? p.k + 1 : 0;
      let bonus = false;
      if (p.k >= C.ACERTOS_PARA_ESPECIAL) { bonus = true; p.k = 0; }
      const li = [`${p.n} avança ${casas} casas${ph.md === "x" ? " (pergunta extra)" : ph.d ? ` (usou ${ph.d} ${ph.d === 1 ? "dica" : "dicas"})` : " sem usar dicas"}.`];
      if (bonus) li.push(`Avanço especial! ${C.ACERTOS_PARA_ESPECIAL} acertos seguidos sem dicas: mais ${C.AVANCO_ESPECIAL} casas.`);
      const pe = [{ o: "m", i: S.t, d: casas }];
      if (bonus) pe.push({ o: "m", i: S.t, d: C.AVANCO_ESPECIAL });
      pe.push({ o: "l", i: S.t });
      log(S, `${p.n} acertou em ${cfg.curto} e avança ${casas}.`);
      res(S, true, ph, "Acertou!", li, pe);
    } else {
      p.k = 0;
      ph.f = "r";
      ph.tn = [];
    }
    return true;
  }

  function reduce(S, D, a, who) {
    const ph = S.ph;
    if (!ph || a.pid !== ph.id) return false;
    const all = !!who.all;
    const isJ = all || !!who.host;
    const isCur = all || who.idx === S.t;
    const n = S.pl.length;
    const isQ = () => all || who.idx === ph.q;

    switch (a.t) {
      case "cat": {
        if (ph.k !== "esc" || !isCur || !C.CATEGORIAS[a.c]) return false;
        const { cat, idx } = E.draw(D, a.c);
        const md = S.exp ? "x" : "n";
        S.exp = false;
        setPh(S, { k: "car", cat, idx, md, q: S.t, f: "p", d: 0, tx: "", tn: [] });
        return true;
      }
      case "dica":
        if (ph.k !== "car" || ph.f !== "p" || ph.d >= 2 || !isQ()) return false;
        ph.d++;
        return true;
      case "conf":
        if (ph.k !== "car" || ph.f !== "p" || !isQ()) return false;
        ph.tx = String(a.tx || "").slice(0, 60);
        ph.f = "j";
        return true;
      case "julga":
        if (!isJ) return false;
        if (ph.k === "car" && ph.f === "j") return judge(S, ph, !!a.ok);
        if (ph.k === "org") {
          const p = S.pl[ph.i];
          if (a.ok) {
            log(S, `${p.n} cumpriu o desafio e avança ${C.ORGULHO_AVANCO}!`);
            res(S, true, null, "Desafio cumprido!", [`${p.n} avança ${C.ORGULHO_AVANCO} casas.`], [{ o: "m", i: ph.i, d: C.ORGULHO_AVANCO }]);
          } else {
            log(S, `${p.n} não cumpriu o desafio e fica na mesma casa.`);
            res(S, false, null, "Não foi dessa vez", [`${p.n} fica na mesma casa.`], []);
          }
          return true;
        }
        return false;
      case "tenta": {
        if (ph.k !== "car" || ph.f !== "r") return false;
        const i = all ? a.i : who.idx;
        if (i == null || i < 0 || i >= n || i === ph.q) return false;
        if (ph.tn.some((x) => x.i === i) || ph.tn.length >= 4) return false;
        ph.tn.push({ i, t: String(a.tx || "").slice(0, 40) });
        return true;
      }
      case "rouba": {
        if (ph.k !== "car" || ph.f !== "r" || !isJ) return false;
        const p = S.pl[S.t];
        const cfg = C.CATEGORIAS[ph.cat];
        if (a.i != null && a.i >= 0 && a.i < n && a.i !== ph.q) {
          const s = S.pl[a.i];
          log(S, `${p.n} errou em ${cfg.curto}. ${s.n} roubou a vez e avança ${C.ROUBO_AVANCO}.`);
          res(S, false, ph, "Roubo de vez!", [`${p.n} fica na casa ${p.x}.`, `${s.n} acertou primeiro e avança ${C.ROUBO_AVANCO} casas.`], [{ o: "m", i: a.i, d: C.ROUBO_AVANCO }]);
        } else {
          log(S, `${p.n} errou em ${cfg.curto} e fica na casa ${p.x}.`);
          res(S, false, ph, "Não foi dessa vez", [`${p.n} permanece na casa ${p.x}.`], []);
        }
        return true;
      }
      case "opp": {
        if (ph.k !== "adv" || !isCur) return false;
        const o = a.i;
        if (!(o >= 0 && o < n) || o === ph.i) return false;
        const { cat, idx } = E.draw(D, E.pick(C.ORDEM_CATEGORIAS));
        log(S, `${S.pl[S.t].n} escolheu ${S.pl[o].n} para responder.`);
        setPh(S, { k: "car", cat, idx, md: "a", q: o, f: "p", d: 0, tx: "", tn: [] });
        return true;
      }
      case "cont": {
        if (!(isJ || isCur)) return false;
        if (ph.k === "res") return runOps(S, ph.pe);
        if (ph.k === "skp") { endTurn(S); return true; }
        if (ph.k === "sup") {
          if (ph.sid === "avanca") return runOps(S, [{ o: "m", i: ph.i, d: C.SURPRESA_AVANCA }]);
          if (ph.sid === "volta") return runOps(S, [{ o: "m", i: ph.i, d: -C.SURPRESA_VOLTA }]);
          if (ph.sid === "perde") return runOps(S, [{ o: "s", i: ph.i }]);
          if (ph.sid === "extra") return runOps(S, [{ o: "x" }]);
          if (ph.sid === "adversario") { setPh(S, { k: "adv", i: ph.i }); return true; }
        }
        return false;
      }
      default:
        return false;
    }
  }

  /* Mantém o estado público abaixo do limite de presença (4 KiB). */
  function compact(S, limit) {
    limit = limit || 3000;
    while (JSON.stringify(S).length > limit && S.lg.length > 1) S.lg.pop();
    return S;
  }

  A.Rules = { create, reduce, compact, PATH, LAST };
})();

/* ============================================================
   TABULEIRO DIGITAL — vista de cima, base quadrada, percurso oval.
   Moldura de madeira com azulejos, selva com hibiscos, faixa de areia
   com borda de renda filé, lagoa com jangadas, igrejas e farol.
   Gera o SVG e as coordenadas de cada casa.
   ============================================================ */
(function () {
  const A = (window.ALAGOAS = window.ALAGOAS || {});
  const C = A.CONFIG;

  const W = 1000, CX = 500, CY = 500, RA = 410, RB = 385;

  function rng(seed) {
    let t = seed >>> 0;
    return function () {
      t += 0x6d2b79f5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function mix(hex, amt, to) {
    const n = parseInt(hex.slice(1), 16), t = parseInt((to || "#FFFFFF").slice(1), 16);
    const c = (sh) => {
      const a = (n >> sh) & 255, b = (t >> sh) & 255;
      return Math.round(a + (b - a) * amt);
    };
    return "#" + [16, 8, 0].map((sh) => c(sh).toString(16).padStart(2, "0")).join("");
  }

  /* ---------- peças ilustradas ---------- */
  function palmTop(x, y, r, rot, seed) {
    const rnd = rng(seed);
    let s = `<g transform="translate(${x} ${y}) rotate(${rot})">`;
    const n = 10;
    for (let i = 0; i < n; i++) {
      const a = (360 / n) * i + rnd() * 8;
      const len = r * (0.82 + rnd() * 0.25);
      s += `<g transform="rotate(${a})"><path d="M0,0 C ${len * 0.2},${-len * 0.25} ${len * 0.24},${-len * 0.7} 0,${-len} C ${-len * 0.24},${-len * 0.7} ${-len * 0.2},${-len * 0.25} 0,0Z" fill="url(#${i % 2 ? "lf2" : "lf1"})" stroke="#0F4A22" stroke-width="2"/><path d="M0,0 L0,${-len * 0.92}" stroke="#0F4A22" stroke-width="2" opacity=".55"/>`;
      for (let k = 1; k < 6; k++) {
        const yy = -len * (k / 6.4), w = len * 0.13 * (1 - k / 7);
        s += `<path d="M0,${yy} l${w},${-w * 0.9} M0,${yy} l${-w},${-w * 0.9}" stroke="#0F4A22" stroke-width="1.6" opacity=".4"/>`;
      }
      s += `</g>`;
    }
    return s + `<circle r="${r * 0.1}" fill="#8A5524" stroke="#4E2E0E" stroke-width="2"/></g>`;
  }

  function hibiscus(x, y, r, rot) {
    let s = `<g transform="translate(${x} ${y}) rotate(${rot})" filter="url(#ds)">`;
    for (let i = 0; i < 5; i++) {
      s += `<g transform="rotate(${i * 72})"><ellipse cx="0" cy="${-r * 0.56}" rx="${r * 0.44}" ry="${r * 0.64}" fill="url(#pet)" stroke="#9C1822" stroke-width="2"/><path d="M0,${-r * 0.2} L0,${-r * 0.95}" stroke="#9C1822" stroke-width="1.5" opacity=".5"/></g>`;
    }
    s += `<circle r="${r * 0.22}" fill="#8F1420"/>`;
    s += `<path d="M0,0 Q${r * 0.3},${-r * 0.2} ${r * 0.55},${-r * 0.55}" stroke="#F7C531" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    for (let k = 0; k < 4; k++) s += `<circle cx="${r * (0.5 + k * 0.04)}" cy="${-r * (0.5 + k * 0.05)}" r="${r * 0.07}" fill="#FFD84D"/>`;
    return s + `</g>`;
  }

  function frangipani(x, y, r, rot, col) {
    let s = `<g transform="translate(${x} ${y}) rotate(${rot})">`;
    for (let i = 0; i < 5; i++) s += `<ellipse cx="0" cy="${-r * 0.5}" rx="${r * 0.3}" ry="${r * 0.55}" fill="${col}" stroke="${mix(col, 0.35, "#000000")}" stroke-width="1.5" transform="rotate(${i * 72})"/>`;
    return s + `<circle r="${r * 0.14}" fill="#FFD84D"/></g>`;
  }

  function leaf(x, y, len, rot, grad) {
    return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0,0 C ${len * 0.32},${-len * 0.25} ${len * 0.32},${-len * 0.75} 0,${-len} C ${-len * 0.32},${-len * 0.75} ${-len * 0.32},${-len * 0.25} 0,0Z" fill="url(#${grad})" stroke="#0F4A22" stroke-width="2"/><path d="M0,0 L0,${-len * 0.9}" stroke="#0F4A22" stroke-width="1.5" opacity=".5"/></g>`;
  }

  /* coqueiro de lado, como na caixa */
  function coqueiro(x, y, s, lean, seed) {
    const rnd = rng(seed);
    let o = `<g transform="translate(${x} ${y}) scale(${s})">`;
    o += `<path d="M0,0 C ${lean * 0.1},-50 ${lean * 0.6},-95 ${lean},-132" fill="none" stroke="#5E3A15" stroke-width="13" stroke-linecap="round"/>`;
    o += `<path d="M0,0 C ${lean * 0.1},-50 ${lean * 0.6},-95 ${lean},-132" fill="none" stroke="#A8743A" stroke-width="8" stroke-linecap="round"/>`;
    for (let k = 1; k < 8; k++) {
      const t = k / 8, px = lean * (0.6 * t * t + 0.4 * t * t * t) + 0, py = -132 * t;
      o += `<path d="M${px - 6},${py} l12,-3" stroke="#5E3A15" stroke-width="2" opacity=".6"/>`;
    }
    o += `<g transform="translate(${lean} -132)">`;
    [-118, -78, -40, 0, 40, 78, 118, 150, -150].forEach((a, i) => {
      const len = 58 + rnd() * 16;

  function lighthouse(x, y, s) {

  function jangada(x, y, s, rot, delay) {

  function sun(x, y, r) {
    let rays = "";
    for (let i = 0; i < 16; i++) {

  function cloud(x, y, s) {
    return `<g transform="translate(${x} ${y}) scale(${s})" fill="#FFFFFF" opacity=".92"><ellipse cx="0" cy="0" rx="34" ry="13"/><circle cx="-14" cy="-9" r="13"/><circle cx="6" cy="-14" r="16"/><circle cx="22" cy="-6" r="11"/></g>`;

  function island(x, y, rx, ry) {

  function flag(x, y, txt, col, checker) {

    if (checker) {
      pen = `<g stroke="#14264F" stroke-width="3" stroke-linejoin="round"><rect x="0" y="-92" width="52" height="38" fill="#fff"/></g>`;
      for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) if ((r + c) % 2 === 0) pen += `<rect x="${c * 10.4}" y="${-92 + r * 9.5}" width="10.4" height="9.5" fill="#14264F"/>`;

  /* ---------- geometria ---------- */
  function ring(N, a, b, off) {
    const M = 4000;
    const phis = [], cum = [0];
    let px = CX, py = CY + b;
    for (let j = 0; j <= M; j++) {
      const phi = (2 * Math.PI * j) / M;
      const x = CX - a * Math.sin(phi), y = CY + b * Math.cos(phi);
      phis.push(phi);
      if (j > 0) cum.push(cum[j - 1] + Math.hypot(x - px, y - py));
      px = x; py = y;
    }
    const L = cum[M], spacing = L / N;
    const pts = [];
    let j = 0;
    for (let k = 0; k < N; k++) {
      const s = (k + off) * spacing;
      while (j < M && cum[j + 1] < s) j++;
      const f = (s - cum[j]) / (cum[j + 1] - cum[j] || 1);
      const phi = phis[j] + f * (phis[j + 1] - phis[j]);
      pts.push({
        x: CX - a * Math.sin(phi),
        y: CY + b * Math.cos(phi),
        ang: (Math.atan2(-b * Math.sin(phi), -a * Math.cos(phi)) * 180) / Math.PI
      });
    }
    return { pts, spacing };
  }

  function tileTitle(t) {
    if (t.tipo === "cat") return `Casa ${t.i} · ${C.CATEGORIAS[t.cat].nome}`;
    if (t.tipo === "surpresa") return `Casa ${t.i} · Surpresa`;
    if (t.tipo === "orgulho") return `Casa ${t.i} · Orgulho de ser alagoano`;
    if (t.tipo === "inicio") return "Início";
    return "Chegada";
  }

  function tileSVG(t, p, size) {
    const h = size / 2;
    let fill, stroke, glyph, numFill = "#FFFFFF";
    if (t.tipo === "cat") { fill = `url(#tg-${t.cat})`; stroke = C.CATEGORIAS[t.cat].corEscura; glyph = C.CATEGORIAS[t.cat].icone; numFill = C.CATEGORIAS[t.cat].fg; }
    else if (t.tipo === "surpresa") { fill = "url(#tg-surpresa)"; stroke = "#F7C531"; glyph = "🎁"; }
    else if (t.tipo === "orgulho") { fill = "url(#tg-orgulho)"; stroke = "#FFF3D6"; glyph = "❤️"; }
    else if (t.tipo === "inicio") { fill = "url(#tg-inicio)"; stroke = "#1F8A4C"; glyph = "🏁"; }
    else { fill = "url(#tg-chegada)"; stroke = "#8A5A00"; glyph = "🏆"; }
    const showNum = t.tipo === "cat" || t.tipo === "surpresa" || t.tipo === "orgulho";
    const rot = `rotate(${p.ang} ${p.x} ${p.y})`;
    const special = t.tipo !== "cat";
    return `<g class="tile" data-i="${t.i}"><title>${tileTitle(t)}</title>
      <g filter="url(#ds)"><rect x="${p.x - h}" y="${p.y - h}" width="${size}" height="${size}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="${special ? 4 : 3}" transform="${rot}"/></g>
      <rect x="${p.x - h + 4}" y="${p.y - h + 4}" width="${size - 8}" height="${size * 0.38}" rx="6" fill="#FFFFFF" opacity=".22" transform="${rot}"/>
      <text x="${p.x}" y="${p.y - (showNum ? 4 : 0)}" text-anchor="middle" dominant-baseline="central" font-size="${size * 0.5}">${glyph}</text>
      ${showNum ? `<text x="${p.x}" y="${p.y + h * 0.68}" text-anchor="middle" dominant-baseline="central" font-size="${size * 0.22}" font-weight="900" fill="${numFill}" font-family="Nunito, sans-serif" stroke="${special ? "#14264F" : "none"}" stroke-width="2" paint-order="stroke">${t.i}</text>` : ""}
    </g>`;
  }

  /* ---------- montagem ---------- */
  function build(path) {
    const N = path.length;
    const { pts, spacing } = ring(N, RA, RB, 0.5);
    const size = Math.min(46, spacing * 0.88);
    const rnd = rng(2025);

    const cats = C.ORDEM_CATEGORIAS;
    let tgs = "";
    cats.forEach((k) => {

    });

    let svg = `<svg id="board-svg" viewBox="0 0 ${W} ${W}" role="img" aria-label="Tabuleiro Alagoas: Arte que Encanta, com ${N} casas em percurso oval" xmlns="http://www.w3.org/2000/svg">

      <linearGradient id="tg-surpresa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D4A96"/><stop offset="1" stop-color="#14264F"/></linearGradient>
      <linearGradient id="tg-orgulho" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7AA3"/><stop offset="1" stop-color="#D6336C"/></linearGradient>

    /* moldura de madeira + faixa de azulejos */
    svg += `<g filter="url(#soft)"><rect x="0" y="0" width="${W}" height="${W}" rx="38" fill="url(#wood)"/></g>`;
    for (let i = 0; i < 26; i++) {
      const y = 8 + rnd() * 984, x1 = 6 + rnd() * 300, x2 = x1 + 160 + rnd() * 500;
      svg += `<path d="M${x1},${y} Q${(x1 + x2) / 2},${y + (rnd() - 0.5) * 10} ${x2},${y}" stroke="#5E3A15" stroke-width="1.4" fill="none" opacity=".25"/>`;
    }
    svg += `<rect x="6" y="6" width="988" height="988" rx="34" fill="none" stroke="#F3C86A" stroke-width="3.5"/>
      <rect x="18" y="18" width="964" height="964" rx="28" fill="url(#azul)" stroke="#14264F" stroke-width="3"/>
      <rect x="44" y="44" width="912" height="912" rx="18" fill="none" stroke="#F7C531" stroke-width="5"/>`;

    /* selva */
    svg += `<g clip-path="url(#jungleClip)"><rect x="50" y="50" width="900" height="900" fill="url(#jung)"/>`;
    for (let i = 0; i < 190; i++) {
      const x = 40 + rnd() * 920, y = 40 + rnd() * 920;
      const nx = (x - CX) / (RA + 56), ny = (y - CY) / (RB + 56);
      if (nx * nx + ny * ny < 1) continue;
      svg += leaf(x, y, 36 + rnd() * 40, rnd() * 360, rnd() > 0.5 ? "lf1" : "lf2");
    }
    const corners = [[122, 122, "gastronomia"], [878, 122, "musica"], [878, 878, "artesanato"], [122, 878, "danca"]];
    corners.forEach((c, k) => (svg += palmTop(c[0], c[1], 150, 12 + k * 31, k + 1)));
    svg += hibiscus(240, 66, 36, 10) + hibiscus(66, 245, 38, 40) + hibiscus(762, 64, 36, 80) + hibiscus(938, 238, 36, 20);
    svg += hibiscus(64, 760, 36, 5) + hibiscus(240, 940, 38, 60) + hibiscus(760, 940, 36, 30) + hibiscus(940, 764, 38, 70);
    svg += hibiscus(500, 68, 28, 0) + hibiscus(934, 500, 28, 40) + hibiscus(66, 500, 28, 20) + hibiscus(500, 934, 28, 55);
    [[330, 70, "#FFD84D"], [668, 72, "#FFB3C7"], [70, 360, "#FFB3C7"], [932, 370, "#FFD84D"], [72, 650, "#FFD84D"], [930, 640, "#FFB3C7"], [330, 932, "#FFB3C7"], [668, 930, "#FFD84D"]]

    /* faixa de areia do percurso */
    svg += `<g filter="url(#soft)"><ellipse cx="${CX}" cy="${CY}" rx="${RA}" ry="${RB}" fill="none" stroke="#6B3F1B" stroke-width="90"/></g>
      <ellipse cx="${CX}" cy="${CY}" rx="${RA}" ry="${RB}" fill="none" stroke="url(#wood)" stroke-width="84"/>
      <ellipse cx="${CX}" cy="${CY}" rx="${RA}" ry="${RB}" fill="none" stroke="url(#band)" stroke-width="72"/>
      <ellipse cx="${CX}" cy="${CY}" rx="${RA}" ry="${RB}" fill="none" stroke="#C9A25A" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity=".7"/>
      <ellipse cx="${CX}" cy="${CY}" rx="${RA + 35}" ry="${RB + 35}" fill="none" stroke="#FFE9A8" stroke-width="2" opacity=".7"/>`;

    /* lagoa */
    svg += `<ellipse cx="${CX}" cy="${CY}" rx="${RA - 41}" ry="${RB - 41}" fill="url(#sea)" stroke="#FFFFFF" stroke-width="5"/>`;
    svg += `<g clip-path="url(#lagoonClip)">`;
    for (let k = 1; k <= 5; k++) svg += `<ellipse cx="${CX}" cy="${CY}" rx="${(RA - 44) * (k / 5.2)}" ry="${(RB - 44) * (k / 5.2)}" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="${0.1 + k * 0.01}"/>`;
    const rw = rng(9);
    for (let i = 0; i < 34; i++) {
      const x = CX + (rw() - 0.5) * 700, y = CY + (rw() - 0.5) * 640;
      svg += `<path class="wv" style="animation-delay:${(rw() * 3).toFixed(2)}s" d="M${x},${y} q10,-9 20,0 t20,0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
    }
    svg += cloud(300, 235, 1) + cloud(700, 215, 0.8) + cloud(585, 262, 0.6);
    svg += sun(445, 252, 30);

    /* ilha da igreja (direita) */
    svg += island(660, 392, 160, 48);
    svg += casarao(560, 392, 40, 34, "#F4C94A") + casarao(752, 394, 44, 38, "#F08BA7") + casarao(610, 376, 34, 30, "#7FC4EF");
    svg += church(668, 352, 1.08);
    svg += coqueiro(545, 400, 0.5, -20, 21) + coqueiro(780, 404, 0.46, 18, 22);

    /* ilha esquerda */
    svg += island(300, 424, 118, 36);
    svg += casarao(236, 424, 32, 28, "#F08BA7") + casarao(372, 426, 34, 30, "#F4C94A");
    svg += church(302, 398, 0.62);
    svg += coqueiro(214, 430, 0.42, -16, 23) + coqueiro(392, 432, 0.4, 14, 24);

    /* farol */
    svg += island(814, 604, 50, 22);
    svg += lighthouse(818, 576, 0.74) + coqueiro(786, 608, 0.3, -10, 25);

    /* jangadas */
    svg += jangada(332, 766, 0.8, -4, 0) + jangada(668, 770, 0.74, 5, 1.2);
    svg += `</g>`;

    /* borda de renda filé na margem da lagoa */
    const lace = ring(120, RA - 38, RB - 38, 0).pts;
    lace.forEach((p) => (svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".95"/>`));

    /* placa do título */
    svg += `<g filter="url(#ds)">
      <rect x="240" y="446" width="520" height="168" rx="44" fill="#FFF4D9" stroke="#8A5A2B" stroke-width="6"/>
      <rect x="252" y="458" width="496" height="144" rx="34" fill="none" stroke="#F0AE1F" stroke-width="3" stroke-dasharray="11 7"/>
    </g>
    <text x="500" y="540" text-anchor="middle" font-family="Lobster, cursive" font-size="98" fill="#14264F" stroke="#FFFFFF" stroke-width="7" paint-order="stroke">Alagoas</text>
    <text x="500" y="594" text-anchor="middle" font-family="Lobster, cursive" font-size="48" fill="#C8283A" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">Arte que Encanta</text>
    <g filter="url(#ds)"><path d="M296,622 L704,622 L690,646 L704,670 L296,670 L310,646Z" fill="#C8283A" stroke="#7E111D" stroke-width="3" stroke-linejoin="round"/></g>
    <text x="500" y="653" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="18" fill="#FFF3D6">Nossa cultura é a nossa maior riqueza!</text>`;

    /* casas */
    path.forEach((t, i) => (svg += tileSVG(t, pts[i], size)));

    /* setas de sentido */
    for (let i = 3; i < N - 1; i += 5) {
      const p = pts[i];
      const dx = CX - p.x, dy = CY - p.y, d = Math.hypot(dx, dy);
      const ax = p.x + (dx / d) * 62, ay = p.y + (dy / d) * 62;
      svg += `<path d="M-11,-10 L9,0 L-11,10 L-5,0Z" transform="translate(${ax} ${ay}) rotate(${p.ang})" fill="#FFD84D" stroke="#14264F" stroke-width="2.5" stroke-linejoin="round"/>`;
    }

    /* bandeiras de início e chegada */
    const s0 = pts[0], sN = pts[N - 1];
    const inward = (p, k) => { const dx = CX - p.x, dy = CY - p.y, d = Math.hypot(dx, dy); return [p.x + (dx / d) * k, p.y + (dy / d) * k]; };
    const [fx0, fy0] = inward(s0, 66), [fx1, fy1] = inward(sN, 66);
    svg += flag(fx0 - 4, fy0, "", "#1F9A55", false) + flag(fx1 + 4, fy1, "", "", true);
    const lab = (x, y, txt, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="Nunito, sans-serif" font-weight="900" font-size="20" fill="#14264F" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" letter-spacing="1">${txt}</text>`;
    svg += lab(fx0 - 14, fy0 + 2, "INÍCIO", "end") + lab(fx1 + 14, fy1 + 2, "CHEGADA", "start");

    svg += `<circle id="hl" r="${size * 0.82}" cx="-100" cy="-100" fill="none" stroke="#FFFFFF" stroke-width="5"/><circle id="hl2" r="${size * 0.82}" cx="-100" cy="-100" fill="none" stroke="#F7C531" stroke-width="3"/>`;
    svg += `<g id="pawns"></g></svg>`;

    const tiles = path.map((t, i) => ({ ...t, x: pts[i].x, y: pts[i].y, ang: pts[i].ang }));
    return { svg, tiles, tileSize: size };
  }

  A.Board = { build, W };
})();

/* ============================================================
   CAMADA DE REDE — sala online por código.
   Usa a capacidade "room" do Claude (presença compartilhada entre
   quem está com a página aberta). Protocolo:
     - cada aparelho publica na sua presença: u (id), n (nome), p (peão),
       role ("h" anfitrião / "j" jogador) e c (código da sala);
     - o anfitrião também publica st (estado do jogo) e lob (lista da sala);
     - os jogadores enviam ações em a: {n: contador, pid, t, ...}.
   Para trocar por outro serviço (Firebase, Supabase...), basta
   reimplementar open() com a mesma interface.
   ============================================================ */
(function () {
  const A = (window.ALAGOAS = window.ALAGOAS || {});
  const ALFA = "abcdefghjkmnpqrstuvwxyz23456789";

  function newCode() {
    let s = "";
    for (let i = 0; i < 5; i++) s += ALFA[Math.floor(Math.random() * ALFA.length)];
    return s;
  }
  function cleanCode(v) {
    return String(v || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 8);
  }

  function uid() {
    try {
      let u = localStorage.getItem("alagoas-uid");
      if (!u) {
        u = "u" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem("alagoas-uid", u);
      }
      return u;
    } catch (e) {
      return "u" + Math.random().toString(36).slice(2, 12);
    }
  }
  const UID = uid();

  async function available() {
    try {
      if (!window.claude || !window.claude.use) return null;
      return await window.claude.use("room");
    } catch (e) {
      return null;
    }
  }

  /* ---- Transporte direto (PeerJS / WebRTC) para a versão aberta ----
     Topologia em estrela: o anfitrião tem o id "alagoas-<código>", os
     jogadores se conectam a ele e ele redistribui a presença de todos. */
  async function openPeer(code, onPeers, onError, isHost) {
    const cfg = A.PEER_CFG || {};
    const hostId = "alagoas-" + code;
    const peer = isHost ? new window.Peer(hostId, cfg) : new window.Peer(cfg);
    await new Promise((res, rej) => {
      const t = setTimeout(() => rej({ code: "indisponivel" }), 12000);
      peer.on("open", () => { clearTimeout(t); res(); });
      peer.on("error", (e) => { clearTimeout(t); rej({ code: e && e.type === "unavailable-id" ? "codigo_ocupado" : "indisponivel" }); });
    });
    peer.on("disconnected", () => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} });
    document.addEventListener("visibilitychange", () => { try { if (!document.hidden && peer.disconnected && !peer.destroyed) peer.reconnect(); } catch (e) {} });
    let mine = {}, seq = 0, closed = false;
    const conns = {}, pres = {};
    let hostConn = null, remote = [];
    const list = () => {
      if (isHost) return [{ id: hostId, isMe: true, presence: mine }].concat(Object.keys(pres).map((id) => ({ id, isMe: false, presence: pres[id] })));
      return remote.map((p) => ({ id: p.id, isMe: p.id === peer.id, presence: p.id === peer.id ? mine : p.presence }));
    };
    const fire = () => { try { onPeers(list()); } catch (e) {} };
    const broadcast = () => {
      const msg = { peers: [{ id: hostId, presence: mine }].concat(Object.keys(pres).map((id) => ({ id, presence: pres[id] }))) };
      Object.keys(conns).forEach((id) => { try { conns[id].send(msg); } catch (e) {} });
      fire();
    };
    if (isHost) {
      peer.on("connection", (c) => {
        conns[c.peer] = c; pres[c.peer] = pres[c.peer] || {};
        c.on("data", (m) => { if (m && m.p) { pres[c.peer] = Object.assign({}, pres[c.peer], m.p); broadcast(); } });
        const gone = () => { delete conns[c.peer]; delete pres[c.peer]; broadcast(); };
        c.on("close", gone); c.on("error", gone);
        c.on("open", broadcast);
      });
    } else {
      hostConn = peer.connect(hostId, { reliable: true });
      hostConn.on("data", (m) => { if (m && m.peers) { remote = m.peers; fire(); } });
      hostConn.on("open", () => { try { hostConn.send({ p: mine }); } catch (e) {} });
      const lost = () => { if (!closed && onError) onError({ code: "caiu" }); };
      hostConn.on("close", lost); hostConn.on("error", lost);
      peer.on("error", (e) => { if (e && e.type === "peer-unavailable") { if (onError) onError({ code: "sem_sala" }); return; } lost(); });
    }
    const meta = async (patch) => {
      mine = Object.assign({}, mine, patch);
      if (isHost) broadcast();
      else if (hostConn && hostConn.open) { try { hostConn.send({ p: patch }); } catch (e) {} }
    };
    return {
      code, uid: UID, meta,
      send: (a) => { seq++; return meta({ a: Object.assign({ n: seq }, a) }); },
      peers: list,
      close: async () => { closed = true; try { peer.destroy(); } catch (e) {} }
    };
  }

  /* Abre a sala. Devolve um controlador ou lança {code}. */
  async function open(code, onPeers, onError, isHost) {
    if (window.Peer) return openPeer(code, onPeers, onError, !!isHost);
    const room = await available();
    if (!room) throw { code: "indisponivel" };
    let nr;
    try {
      nr = await room.join("alagoas-" + code);
    } catch (e) {
      throw { code: (e && e.code) || "falha" };
    }
    let seq = 0;
    let unsub = null;
    try {
      unsub = nr.onPeers((ch) => onPeers(ch.peers), (e) => onError && onError(e));
    } catch (e) {}
    const safe = (p) => Promise.resolve(p).catch(() => {});
    return {
      code,
      uid: UID,
      meta: (patch) => safe(nr.presence(patch)),
      send: (a) => { seq++; return safe(nr.presence({ a: Object.assign({ n: seq }, a) })); },
      peers: () => nr.peers(),
      close: async () => {
        try { if (unsub) unsub(); } catch (e) {}
        try { await nr.leave(); } catch (e) {}
      }
    };
  }

  A.Net = { open, newCode, cleanCode, available, UID, direct: () => !!window.Peer };
})();
