        <div class="brand"><span class="brand-a">Alagoas</span><span class="brand-b">Arte que Encanta</span></div>
        <div class="top-actions">
          <span class="room-badge" id="room-badge" hidden></span>
          <button class="btn btn-ghost btn-sm" data-act="regras">Como jogar</button>
          <button class="btn btn-ghost btn-sm" data-act="menu">Menu</button>
        </div>
      </header>
      <div class="game">
        <section class="board-col" aria-label="Tabuleiro">
          <div class="board-box">${BOARD.svg}</div>
          <ul class="legend" aria-label="Legenda das casas">
            ${C.ORDEM_CATEGORIAS.map((k) => `<li style="${catStyle(k)}"><i class="lg" aria-hidden="true">${C.CATEGORIAS[k].icone}</i>${C.CATEGORIAS[k].curto}</li>`).join("")}
            <li class="lg-special"><i class="lg lg-s" aria-hidden="true">🎁</i>Surpresa</li>
            <li class="lg-special"><i class="lg lg-o" aria-hidden="true">❤️</i>Orgulho de ser alagoano</li>
          </ul>
        </section>
        <aside class="side">
          <section class="panel turn" id="turn-panel" aria-live="polite"></section>
          <section class="panel" id="players-panel" aria-label="Jogadores"></section>
          <section class="panel" id="log-panel" aria-label="Histórico"></section>
        </aside>
      </div>
    </div>`;
    $("#pawns").innerHTML = VIEW.pl.map((p, i) => {
      const pe = peaoDe(p);
      return `<g class="pawn" id="pawn-${i}"><g filter="url(#ds)"><ellipse cx="0" cy="17" rx="15" ry="5" fill="#0A1A33" opacity=".35"/><circle r="20" fill="#FFFFFF"/><circle r="17" fill="${pe.cor}"/><ellipse cx="-4" cy="-9" rx="9" ry="5" fill="#FFFFFF" opacity=".35"/></g><text text-anchor="middle" dominant-baseline="central" font-size="21" y="1">${pe.icone}</text><title>${esc(p.n)}</title></g>`;
    }).join("");
  }

  const PLAYER_ROLE = () => (MODE === "local" ? "" : ME.idx >= 0 ? "" : ME.host ? "Mediador" : "Espectador");

  function renderBadge() {
    const el = $("#room-badge");
    if (!el) return;
    if (MODE === "local" || !ONL) { el.hidden = true; return; }
    el.hidden = false;
    el.textContent = `Sala ${ONL.code.toUpperCase()}${PLAYER_ROLE() ? " · " + PLAYER_ROLE() : ""}`;
  }

  function renderAll() { renderTurn(); renderPlayers(); renderLog(); markActive(); renderBadge(); }

  function renderTurn() {
    const S = VIEW, el = $("#turn-panel");
    if (!S || !el) return;
    const p = S.pl[S.t], pe = peaoDe(p);
    const esc_ = S.ph.k === "esc";
    const minha = ME.all || ME.idx === S.t;
    const livre = esc_ && minha && !UI.anim;
    const meuTurno = !ME.all && ME.idx === S.t;
    let hint;
    if (S.ph.k === "fim") hint = "Partida encerrada.";
    else if (esc_) hint = minha ? "Escolha a categoria da sua pergunta:" : `Aguardando ${p.n} escolher a categoria…`;
    else hint = "Jogada em andamento…";
    el.innerHTML = `
      <div class="turn-head"><span class="avatar" style="--c:${pe.cor}" aria-hidden="true">${pe.icone}</span>
        <div><div class="eyebrow">Rodada ${S.r}${S.exp ? " · pergunta extra" : ""}</div><h2>${meuTurno ? "Sua vez, " + esc(p.n) : "Vez de " + esc(p.n)}</h2></div></div>
      <p class="hint">${hint}</p>
      <div class="cats">
        ${C.ORDEM_CATEGORIAS.map((k) => `<button class="cat-btn" style="${catStyle(k)}" data-act="cat" data-cat="${k}" ${livre ? "" : "disabled"}><span class="ic" aria-hidden="true">${C.CATEGORIAS[k].icone}</span><span class="tx">${C.CATEGORIAS[k].curto}${k === "musica" ? "<small>Terra de Djavan</small>" : ""}</span></button>`).join("")}
      </div>`;
  }

  function renderPlayers() {
    const S = VIEW, el = $("#players-panel");
    if (!S || !el) return;
    el.innerHTML = `<h3>Jogadores</h3><ul class="plist2">${S.pl.map((p, i) => {
      const pe = peaoDe(p);
      const pos = DISP[i] != null ? DISP[i] : p.x;
      const pct = Math.round((pos / R.LAST) * 100);
      const dots = Array.from({ length: C.ACERTOS_PARA_ESPECIAL }, (_, k) => `<i class="dot ${k < p.k ? "on" : ""}"></i>`).join("");
      return `<li class="pl ${i === S.t ? "on" : ""}">
        <span class="avatar sm" style="--c:${pe.cor}" aria-hidden="true">${pe.icone}</span>
        <div class="pl-main">
          <div class="pl-name">${esc(p.n)}${!ME.all && i === ME.idx ? ' <span class="tag">você</span>' : ""}${p.s > 0 ? ' <span class="tag">perde a vez</span>' : ""}${i === S.t ? ' <span class="tag on">na vez</span>' : ""}</div>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Progresso de ${esc(p.n)}"><i style="width:${pct}%"></i></div>
          <div class="pl-meta"><span>Casa ${pos} de ${R.LAST}</span><span class="streak" title="Acertos seguidos sem dica">${dots}</span></div>
        </div></li>`;
    }).join("")}</ul>`;
  }

  function renderLog() {
    const S = VIEW, el = $("#log-panel");
    if (!S || !el) return;
    el.innerHTML = `<h3>Últimas jogadas</h3>${S.lg.length ? `<ol class="log">${S.lg.map((l) => `<li>${esc(l)}</li>`).join("")}</ol>` : `<p class="muted">As jogadas aparecem aqui.</p>`}`;
  }

  /* ---------- peões ---------- */
  const OFFS = {
    1: [[0, 0]],
    2: [[-13, 0], [13, 0]],
    3: [[-13, -9], [13, -9], [0, 12]],
    4: [[-13, -12], [13, -12], [-13, 12], [13, 12]]
  };
  function placeAll() {
    const groups = {};
    DISP.forEach((x, i) => (groups[x] = groups[x] || []).push(i));
    Object.keys(groups).forEach((pos) => {
      const ids = groups[pos], t = BOARD.tiles[pos], offs = OFFS[ids.length];
      ids.forEach((id, k) => {
        const g = $("#pawn-" + id);
        if (g) g.style.transform = `translate(${t.x + offs[k][0]}px, ${t.y + offs[k][1]}px)`;
      });
    });
    placeHL();
  }
  function placeHL() {
    if (!VIEW || !BOARD) return;
    const x = DISP[VIEW.t] != null ? DISP[VIEW.t] : VIEW.pl[VIEW.t].x;
    const t = BOARD.tiles[x];
    ["#hl", "#hl2"].forEach((id) => {
      const c = $(id);
      if (c) { c.setAttribute("cx", t.x); c.setAttribute("cy", t.y); }
    });
  }
  function markActive() {
    if (!VIEW) return;
    VIEW.pl.forEach((_, i) => {
      const g = $("#pawn-" + i);
      if (g) g.classList.toggle("ativo", i === VIEW.t);
    });
    placeHL();
  }

  async function animate(prev, next) {
    UI.anim = true;
    renderTurn();
    for (let i = 0; i < next.pl.length; i++) {
      const to = next.pl[i].x;
      if (DISP[i] === to) continue;
      const from = DISP[i];
      const n = Math.abs(to - from);
      toast(`${peaoDe(next.pl[i]).icone} ${next.pl[i].n} ${to > from ? "avança" : "volta"} ${n} ${n === 1 ? "casa" : "casas"}`);
      await sleep(reduced ? 0 : 350);
      const g = $("#pawn-" + i);
      if (g) g.parentNode.appendChild(g);
      const dir = to > from ? 1 : -1;
      while (DISP[i] !== to) {
        DISP[i] += dir;
        placeAll();
        renderPlayers();
        await sleep(STEP_MS);
      }
    }
    UI.anim = false;
  }

  /* ============ APRESENTAÇÃO DO ESTADO ============ */
  function presentState(S) {
    UI.queue.push(S);
    if (!UI.run) pump();
  }
  async function pump() {
    UI.run = true;
    while (UI.queue.length) {
      const S = UI.queue.shift();
      try { await showState(S); } catch (e) { UI.anim = false; if (window.console) console.error(e); }
    }
    UI.run = false;
  }
  async function showState(S) {
    if (!shell) {
      BOARD = BOARD || B.build(R.PATH);
      VIEW = S;
      renderGameShell();
      shell = true;
      DISP = S.pl.map((p) => p.x);
      placeAll();
      renderAll();
      renderPhase();
      return;
    }
    closePhase();
    const prev = VIEW;
    VIEW = S;
    await animate(prev, S);
    DISP = S.pl.map((p) => p.x);
    placeAll();
    renderAll();
    renderPhase();
  }

  /* ============ FASES (cartas e avisos) ============ */
  function setPhaseOverlay(html, cls) {
    let ov = $("#ph-ov");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "ph-ov";
      ov.className = "overlay";
      ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>`;
      $("#modal-root").appendChild(ov);
      lockScroll();
    }
    const sh = ov.firstElementChild;
    sh.className = "sheet " + (cls || "");
    sh.innerHTML = html;
    return sh;
  }
  function closePhase() {
    const ov = $("#ph-ov");
    if (ov) ov.remove();
    lockScroll();
    stopSpeak();
  }

  function judgeBox() {
    const S = VIEW, ph = S.ph, c = CARTAS[ph.cat][ph.idx];
    return `<div class="judge"><div class="eyebrow">Responsável pela partida</div>
      <button class="btn btn-ghost" data-a="ver" aria-expanded="${UI.ver}">${UI.ver ? "🙈 Esconder a resposta" : "👁 Ver a resposta correta"}</button>
      ${UI.ver ? `<div class="answer"><span>Resposta</span><strong>${esc(c[3])}</strong></div>` : ""}</div>`;
  }

  function cardPhase(S) {
    const ph = S.ph, c = CARTAS[ph.cat][ph.idx], cfg = C.CATEGORIAS[ph.cat], q = S.pl[ph.q];
    const isAdv = ph.md === "a", isX = ph.md === "x";
    const meQ = ME.all || ME.idx === ph.q;
    const isJ = ME.all || ME.host;
    const hints = [c[1], c[2]].slice(0, ph.d);
    const dicasHtml = hints.map((h, k) => `<div class="hintbox"><span>Dica ${k + 1}</span>${esc(h)}</div>`).join("");
    const speakBtn = canSpeak() ? `<button class="btn btn-ghost" data-a="falar" aria-label="Ler a pergunta em voz alta">🔊 Ler em voz alta</button>` : "";

    let prize;
    if (isAdv) prize = `<div class="prize"><small>Pergunta para</small><b>${esc(q.n)}</b></div>`;
    else if (ph.f === "r") prize = `<div class="prize"><small>Roubo de vez</small><b>+${C.ROUBO_AVANCO} casas</b></div>`;
    else if (isX) prize = `<div class="prize"><small>Pergunta extra</small><b>${C.EXTRA_AVANCO} casas</b></div>`;
    else prize = `<div class="prize"><small>Vale</small><b>${E.avanco(ph.d)} casas</b></div>`;

    let steps = "";
    if (!isAdv && !isX && ph.f !== "r") {
      const lab = ["Sem dica", "1ª dica", "2ª dica"];
      steps = `<ol class="steps" aria-label="Casas por dica">${C.AVANCO_POR_DICAS.map((v, k) => `<li class="${k === ph.d ? "on" : k < ph.d ? "past" : ""}"><span>${lab[k]}</span><b>${v}</b></li>`).join("")}</ol>`;
    }

    let corpo;
    if (ph.f === "p") {
      corpo = dicasHtml + (meQ ? `
        <div class="row-actions">
          ${ph.d < 2 ? `<button class="btn btn-ghost" data-a="dica">💡 Pedir ${ph.d === 0 ? "a 1ª" : "a 2ª"} dica${isAdv || isX ? "" : ` <small>(passa a valer ${E.avanco(ph.d + 1)})</small>`}</button>` : ""}
          ${speakBtn}
        </div>
        <label class="flabel" for="resp">Resposta de ${esc(q.n)} <span class="muted">(opcional, pode responder em voz alta)</span></label>
        <input id="resp" class="input" type="text" maxlength="60" autocomplete="off">
        <button class="btn btn-primary btn-xl" data-a="conf">Confirmar resposta</button>` : `
        <div class="row-actions">${speakBtn}</div>
        <p class="wait">⏳ ${esc(q.n)} está respondendo…</p>`);
    } else if (ph.f === "j") {
      corpo = dicasHtml + `<div class="said"><span class="avatar sm" style="--c:${peaoDe(q).cor}" aria-hidden="true">${peaoDe(q).icone}</span>
          <div>${esc(q.n)} respondeu${ph.tx ? `: <q>${esc(ph.tx)}</q>` : " em voz alta."}</div></div>` +
        (isJ ? `${judgeBox()}
          <div class="verdict">
            <button class="btn btn-ok btn-xl" data-a="acertou">✅ Acertou</button>
            <button class="btn btn-no btn-xl" data-a="errou">❌ Errou</button>
          </div>` : `<p class="wait">⏳ O mediador está conferindo a resposta…</p>`);
    } else {
      const outros = S.pl.map((p, k) => [p, k]).filter(([, k]) => k !== ph.q);
      const tent = ph.tn.length ? `<ul class="tents">${ph.tn.map((x) => `<li><b>${esc(S.pl[x.i].n)}</b> tentou${x.t ? `: <q>${esc(x.t)}</q>` : ""}</li>`).join("")}</ul>` : "";
      const mayTry = !ME.all && ME.idx >= 0 && ME.idx !== ph.q && !ph.tn.some((x) => x.i === ME.idx);
      corpo = `<div class="steal"><div class="big" aria-hidden="true">🏴‍☠️</div><div><b>Roubo de vez!</b> ${esc(q.n)} errou. Os outros jogadores podem tentar a mesma pergunta. Quem acertar primeiro avança ${C.ROUBO_AVANCO} casas.</div></div>
        ${dicasHtml}${tent}` +
        (isJ ? `${judgeBox()}
          <div class="eyebrow">Quem acertou primeiro?</div>
          <div class="choices">
            ${outros.map(([p, k]) => `<button class="btn btn-ok" data-a="rouba" data-i="${k}">${peaoDe(p).icone} ${esc(p.n)} acertou</button>`).join("")}
            <button class="btn btn-no" data-a="ninguem">Ninguém acertou</button>
          </div>` : mayTry ? `
          <label class="flabel" for="resp">Sua tentativa <span class="muted">(opcional)</span></label>
          <input id="resp" class="input" type="text" maxlength="40" autocomplete="off">
          <button class="btn btn-primary btn-xl" data-a="tenta">🙋 Tentar responder</button>` : `<p class="wait">⏳ Aguardando o mediador…</p>`);
    }

    const html = `<article class="card" style="${catStyle(ph.cat)}">
      <header class="card-head">
        <span class="ic" aria-hidden="true">${cfg.icone}</span>
        <div class="ct"><div class="cat-name">${cfg.nome}</div>
          <div class="card-sub">Carta ${ph.idx + 1} de ${CARTAS[ph.cat].length}${ph.cat === "musica" ? " · Alagoas, terra de Djavan" : ""}${isX ? " · Pergunta extra" : ""}</div></div>
        ${prize}
      </header>
      <div class="card-body">${steps}<h2 class="question" id="q">${esc(c[0])}</h2>${corpo}</div>
    </article>`;
    return { html, cls: "sheet-card" };
  }

  function resPhase(S) {
    const ph = S.ph;
    const canC = ME.all || ME.host || ME.idx === S.t;
    let ans = "";
    if (ph.cat) {
      const c = CARTAS[ph.cat][ph.idx], cfg = C.CATEGORIAS[ph.cat];
      ans = `<div class="answer" style="${catStyle(ph.cat)}"><span>${cfg.icone} Resposta correta</span><strong>${esc(c[3])}</strong></div>`;
    }
    return {
      html: `<div class="result ${ph.ok ? "ok" : "no"}"><div class="big" aria-hidden="true">${ph.ok ? "🎉" : "😅"}</div><h2>${esc(ph.ti)}</h2>${ans}${ph.li.map((l) => `<p>${esc(l)}</p>`).join("")}
        ${canC ? `<button class="btn btn-primary btn-xl" data-a="cont" data-focus>Continuar</button>` : `<p class="wait">⏳ Aguardando…</p>`}</div>`,
      cls: ""
    };
  }

  function phasePhase(S) {
    const ph = S.ph;
    const canC = ME.all || ME.host || ME.idx === S.t;
    const isJ = ME.all || ME.host;
    if (ph.k === "sup") {
      const s = C.SURPRESAS.find((x) => x.id === ph.sid);
      const p = S.pl[ph.i];
      return { html: `<div class="info gold"><div class="big" aria-hidden="true">${s.icone}</div><h2>Casa Surpresa!</h2><p><b>${esc(p.n)}</b>: ${esc(s.titulo)}</p>
        ${canC ? `<button class="btn btn-primary" data-a="cont" data-focus>Entendi</button>` : `<p class="wait">⏳ Aguardando…</p>`}</div>`, cls: "" };
    }
    if (ph.k === "skp") {
      return { html: `<div class="info"><div class="big" aria-hidden="true">⏸️</div><h2>Perde a rodada</h2><p>${esc(S.pl[ph.i].n)} está sem jogar nesta rodada.</p>
        ${canC ? `<button class="btn btn-primary" data-a="cont" data-focus>Passar a vez</button>` : `<p class="wait">⏳ Aguardando…</p>`}</div>`, cls: "" };
    }
    if (ph.k === "adv") {
      const p = S.pl[ph.i];
      const outros = S.pl.map((q, k) => [q, k]).filter(([, k]) => k !== ph.i);
      const mine = ME.all || ME.idx === ph.i;
      return { html: `<div class="info"><div class="big" aria-hidden="true">🎯</div><h2>Escolha um adversário</h2><p>${esc(p.n)}, quem vai responder a uma pergunta?</p>
        <p class="note">Se o adversário errar, volta ${C.ADVERSARIO_ERRA_VOLTA} casas.</p>
        ${mine ? `<div class="choices">${outros.map(([q, k], n) => `<button class="btn btn-ghost" data-a="opp" data-i="${k}" ${n === 0 ? "data-focus" : ""}>${peaoDe(q).icone} ${esc(q.n)}</button>`).join("")}</div>` : `<p class="wait">⏳ ${esc(p.n)} está escolhendo…</p>`}</div>`, cls: "" };
    }
    if (ph.k === "org") {
      const p = S.pl[ph.i];
      return { html: `<div class="info"><div class="big" aria-hidden="true">❤️</div><h2>Orgulho de ser alagoano</h2>
        <p><b>${esc(p.n)}</b>, seu desafio:<br><span class="desafio">${esc(ph.ds)}</span></p>
        <p class="note">Cumprindo o desafio, avança ${C.ORGULHO_AVANCO} casas. O responsável pela partida confere.</p>
        ${isJ ? `<div class="choices"><button class="btn btn-ok" data-a="orgok" data-focus>✅ Cumpriu (+${C.ORGULHO_AVANCO})</button><button class="btn btn-no" data-a="orgno">❌ Não conseguiu</button></div>` : `<p class="wait">⏳ O mediador está conferindo…</p>`}</div>`, cls: "" };
    }
    if (ph.k === "fim") {
      const w = S.pl[ph.w], pe = peaoDe(w);
      const conf = Array.from({ length: 36 }, (_, k) => `<i style="--x:${(k * 97) % 100}%;--d:${(k % 9) * 0.35}s;--s:${3 + (k % 5)}s;--c:${["#C8283A", "#F0AE1F", "#23803D", "#7A3C9E", "#2A6FD1"][k % 5]}"></i>`).join("");
      const canNew = MODE !== "client";
      return { html: `<div class="win"><div class="confetti" aria-hidden="true">${conf}</div>
        <div class="trophy" aria-hidden="true">🏆</div>
        <p class="eyebrow">Vencedor</p>
        <h2 class="win-name"><span class="avatar" style="--c:${pe.cor}" aria-hidden="true">${pe.icone}</span> ${esc(w.n)}</h2>
        <p class="win-msg">${C.MENSAGEM_VITORIA}</p>
        <div class="choices">
          ${canNew ? `<button class="btn btn-primary btn-xl" data-a="novo" data-focus>🎲 Nova partida</button>` : `<p class="wait">⏳ O anfitrião pode começar uma nova partida.</p>`}
          <button class="btn btn-ghost btn-xl" data-a="sair">${MODE === "local" ? "Voltar ao início" : "Sair da sala"}</button>
        </div></div>`, cls: "sheet-win" };
    }
    return null;
  }

  function renderPhase() {
    const S = VIEW;
    if (!S) return;
    const ph = S.ph;
    if (ph.id !== UI.txPid) { UI.txPid = ph.id; UI.tx = ""; UI.ver = false; UI.fresh = true; } else UI.fresh = false;
    const fk = ph.k + (ph.f || "");
    if (fk !== UI.fk) { UI.fk = fk; UI.ver = false; }
    let out = null;
    if (ph.k === "car") out = cardPhase(S);
    else if (ph.k === "res") out = resPhase(S);
    else out = phasePhase(S);
    if (!out) { closePhase(); return; }
    const sh = setPhaseOverlay(out.html, out.cls);
    const inp = sh.querySelector("#resp");
    if (inp) {
      inp.value = UI.tx;
      inp.addEventListener("input", () => (UI.tx = inp.value));
      inp.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { const b = sh.querySelector('[data-a="conf"], [data-a="tenta"]'); if (b) b.click(); }
      });
    }
    if (UI.fresh || UI.keepFocus) {
      const f = sh.querySelector("#resp") || sh.querySelector("[data-focus]") || sh.querySelector("[data-a]");
      if (f) f.focus({ preventScroll: true });
    }
  }

  /* ============ AÇÕES ============ */
  function dispatch(t, data) {
    const S = VIEW;
    if (!S || UI.anim) return;
    const a = Object.assign({ t, pid: S.ph.id }, data || {});
    if (MODE === "client") { if (NETC) NETC.send(a); }
    else hostApply(a, MODE === "local" ? { all: true } : { idx: ME.idx, host: true });
  }

  function hostApply(a, who) {
    if (!HOST) return;
    const changed = R.reduce(HOST.S, HOST.D, a, who);
    if (!changed) return;
    HOST.S.ver++;
    saveHost();
    publish();
  }

  function publish() {
    R.compact(HOST.S);
    const snap = JSON.parse(JSON.stringify(HOST.S));
    presentState(snap);
    if (MODE === "host" && NETC) NETC.meta({ st: snap });
  }

  function saveHost() {
    if (!HOST) return;
    if (HOST.S.ph.k === "fim") { if (MODE === "local") ls.del(KEY_LOCAL); return; }
    if (MODE === "local") ls.set(KEY_LOCAL, JSON.stringify(HOST));
    else if (MODE === "host" && ONL) ls.set(KEY_HOST, JSON.stringify({ code: ONL.code, nome: ONL.nome, peao: ONL.peao, med: ONL.med, HOST }));
  }
  function loadLocal() {
    try {
      const h = JSON.parse(ls.get(KEY_LOCAL) || "null");
      if (h && h.S && h.S.v === 2 && h.S.ph && h.S.ph.k !== "fim") return h;
    } catch (e) {}
    return null;
  }
  function loadHostSave() {
    try {
      const h = JSON.parse(ls.get(KEY_HOST) || "null");
      if (h && h.code && h.HOST && h.HOST.S && h.HOST.S.ph && h.HOST.S.ph.k !== "fim") return h;
    } catch (e) {}
    return null;
  }

  function resetView() {
    shell = false;
    VIEW = null;
    DISP = [];
    UI.queue = [];
    UI.anim = false;
    UI.txPid = null;
    closePhase();
  }

  /* ---------- começar partidas ---------- */
  function startLocal(players, sortear) {
    MODE = "local";
    ME = { all: true, host: true, idx: -1 };
    resetView();
    HOST = R.create(players, { sortear, mode: "local" });
    saveHost();
    publish();
  }
  function resumeLocal() {
    const h = loadLocal();
    if (!h) return;
    MODE = "local";
    ME = { all: true, host: true, idx: -1 };
    resetView();
    HOST = h;
    publish();
  }
  function startOnlineGame(players, opts) {
    MODE = "host";
    resetView();
    HOST = R.create(players, Object.assign({ mode: "online" }, opts));
    ME = { idx: HOST.S.pl.findIndex((p) => p.u === N.UID), host: true };
    ONL.started = true;
    saveHost();
    publish();
  }

  function leaveToHome() {
    stopNet();
    MODE = "local";
    ME = { all: true, host: true, idx: -1 };
    HOST = null;
    resetView();
    renderHome();
  }

  /* ============ ONLINE ============ */
  let WL = null;
  async function keepAwake() {
    try { if (navigator.wakeLock && !document.hidden) WL = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (ONL && !document.hidden) keepAwake(); });

  function stopNet() {
    try { if (WL) WL.release(); } catch (e) {}
    WL = null;
    if (ONL && ONL.timer) clearTimeout(ONL.timer);
    if (ONL && ONL.goneTimer) clearTimeout(ONL.goneTimer);
    if (NETC) { NETC.close(); NETC = null; }
    ONL = null;
  }

  const NET_MSG = {
    indisponivel: "O modo online só funciona dentro do Claude, para quem tem acesso a este jogo. Peça ao dono do jogo para compartilhá-lo com você, ou jogue no mesmo aparelho.",
    not_permitted: "Este jogo não permite salas online para você. Peça ao dono do jogo para compartilhá-lo com o seu e-mail.",
    not_granted: "Este jogo não permite salas online para você. Peça ao dono do jogo para compartilhá-lo com o seu e-mail."
  };

  async function connectRoom(papel, code) {
    const O = UI.on;
    const nome = (O.nome || "").trim() || "Jogador";
    ls.set(KEY_NOME, nome);
    ONL = { code, nome, peao: O.peao, med: papel === "host" && O.med, papel, seen: {}, order: {}, roster: [], lastLob: "", hostPeer: false, started: false, err: "", ver: -1, g: null };
    try {
      NETC = await N.open(code, onPeers, onNetError, papel === "host");
    } catch (e) {
      ONL = null;
      O.busy = false;
      O.err = (e && e.code === "codigo_ocupado" && "Esse código já está em uso. Tente criar de novo.") || (N.direct() && e && e.code === "indisponivel" && "Não consegui conectar ao serviço online. Verifique sua internet e tente de novo.") || NET_MSG[e && e.code] || "Não consegui abrir a sala agora. Tente de novo em instantes.";
      renderOnlineMenu();
      return false;
    }
    MODE = papel;
    keepAwake();
    await NETC.meta({ u: N.UID, n: nome, p: O.peao, role: papel === "host" ? "h" : "j", c: code, h: papel === "host" ? 1 : null });
    return true;
  }

  async function criarSala() {
    const O = UI.on;
    O.busy = true; O.err = ""; renderOnlineMenu();
    const code = N.newCode();
    if (!(await connectRoom("host", code))) return;
    refreshRoster(NETC.peers().filter((p) => !p.isMe));
    UI.screen = "lobby";
    renderLobby();
  }

  async function entrarSala() {
    const O = UI.on;
    const code = N.cleanCode(O.code);
    if (code.length < 4) { O.err = "Digite o código da sala."; renderOnlineMenu(); return; }
    O.busy = true; O.err = ""; renderOnlineMenu();
    if (!(await connectRoom("client", code))) return;
    UI.screen = "lobby";
    renderLobby();
    ONL.timer = setTimeout(semSala, 25000);
  }

  function semSala() {
    if (!ONL || ONL.papel !== "client" || ONL.hostPeer) return;
    stopNet();
    MODE = "local";
    UI.on.busy = false;
    UI.on.err = "Não encontrei essa sala. Confira o código e peça para o anfitrião manter o jogo aberto, com a tela ligada.";
    UI.on.tab = "entrar";
    renderOnlineMenu();
  }

  async function retomarSala() {
    const h = loadHostSave();
    if (!h) return;
    const O = UI.on;
    O.nome = h.nome || O.nome; O.peao = h.peao || O.peao; O.med = !!h.med;
    O.busy = true; O.err = ""; renderOnlineMenu();
    if (!(await connectRoom("host", h.code))) return;
    MODE = "host";
    resetView();
    HOST = h.HOST;
    ME = { idx: HOST.S.pl.findIndex((p) => p.u === N.UID), host: true };
    ONL.started = true;
    ONL.med = !!h.med;
    publish();
  }

  function onNetError(e) {
    if (!ONL) return;
    if (e && e.code === "sem_sala") { semSala(); return; }
    if (UI.screen === "lobby") { ONL.err = "A conexão com a sala caiu. Saia e entre de novo."; renderLobby(); }
  }

  function onPeers(peers) {
    if (!ONL) return;
    const ps = peers.filter((p) => !p.isMe);
    if (ONL.papel === "host") hostPeers(ps); else clientPeers(ps);
  }

  function refreshRoster(ps) {
    const seats = [];
    const taken = new Set();
    const addSeat = (u, n, p, host) => {
      if (seats.length >= 4 || seats.some((s) => s.u === u)) return;
      let pawn = p;
      if (taken.has(pawn)) { const free = C.PEOES.find((x) => !taken.has(x.id)); pawn = free ? free.id : pawn; }
      taken.add(pawn);
      seats.push({ u, n: String(n || "Jogador").slice(0, C.MAX_NOME), p: pawn, host: host ? 1 : 0 });
    };
    if (!ONL.med) addSeat(N.UID, ONL.nome, ONL.peao, true);
    ps.forEach((p) => {
      const pr = p.presence || {};
      if (pr.c === ONL.code && pr.role === "j" && pr.u && ONL.order[pr.u] == null) ONL.order[pr.u] = Object.keys(ONL.order).length;
    });
    ps.filter((p) => { const pr = p.presence || {}; return pr.c === ONL.code && pr.role === "j" && pr.u; })
      .sort((a, b) => ONL.order[a.presence.u] - ONL.order[b.presence.u])
      .forEach((p) => addSeat(p.presence.u, p.presence.n, p.presence.p, false));
    const key = JSON.stringify(seats);
    ONL.roster = seats;
    if (key !== ONL.lastLob) {
      ONL.lastLob = key;
      if (NETC) NETC.meta({ lob: seats });
      if (UI.screen === "lobby") renderLobby();
    }
  }

  function hostPeers(ps) {
    if (!ONL.started) { refreshRoster(ps); return; }
    if (!HOST) return;
    ps.forEach((p) => {
      const pr = p.presence || {};
      if (!pr.u || !pr.a || typeof pr.a.n !== "number") return;
      if (pr.a.n <= (ONL.seen[pr.u] || 0)) return;
      ONL.seen[pr.u] = pr.a.n;
      const act = Object.assign({}, pr.a);
      delete act.n;
      const idx = HOST.S.pl.findIndex((x) => x.u === pr.u);
      hostApply(act, { idx, host: false });
    });
  }

  function clientPeers(ps) {
    const host = ps.find((p) => p.presence && p.presence.h === 1 && p.presence.c === ONL.code);
    if (!host) {
      if (ONL.hostPeer && !ONL.goneTimer) ONL.goneTimer = setTimeout(hostLeft, 6000);
      return;
    }
    ONL.hostPeer = true;
    if (ONL.goneTimer) { clearTimeout(ONL.goneTimer); ONL.goneTimer = null; }
    const pr = host.presence;
    if (pr.st) {
      const st = pr.st;
      if (st.g !== ONL.g) { ONL.g = st.g; ONL.ver = -1; resetView(); }
      if (st.ver <= ONL.ver) return;
      ONL.ver = st.ver;
      ME = { idx: st.pl.findIndex((x) => x.u === N.UID), host: false };
      MODE = "client";
      presentState(st);
    } else if (pr.lob) {
      ONL.roster = pr.lob;
      if (UI.screen === "lobby") renderLobby();
    }
  }

  async function hostLeft() {
    if (!ONL) return;
    ONL.goneTimer = null;
    stopNet();
    await infoModal({ icone: "👋", titulo: "O anfitrião saiu", texto: "A sala foi encerrada. Você pode criar outra ou jogar no mesmo aparelho.", botao: "Voltar ao início" });
    leaveToHome();
  }

  /* ============ TEXTOS ============ */
  const COMO_JOGAR = `
    <h2>Como jogar</h2>
    <p class="lead2">Responda perguntas sobre a cultura, a gastronomia, a música, o artesanato e as danças de Alagoas e avance pelo tabuleiro. Vence quem alcançar ou ultrapassar a última casa.</p>
    <h3>Na sua vez</h3>
    <ol class="rules">
      <li>Escolha livremente uma categoria: 🍲 Gastronomia, 🎵 Música, 🧶 Artesanato ou 💃 Dança.</li>
      <li>Uma pergunta da categoria aparece. Responda na hora ou peça a 1ª dica. Ainda em dúvida? Peça a 2ª dica.</li>
      <li>O responsável pela partida confere a resposta e marca se acertou.</li>
    </ol>
    <h3>Quanto você avança</h3>
    <div class="table">
      <div><span>Acertou sem dicas</span><b>6 casas</b></div>
      <div><span>Acertou com a 1ª dica</span><b>4 casas</b></div>
      <div><span>Acertou com a 2ª dica</span><b>2 casas</b></div>
      <div><span>Errou</span><b>não avança</b></div>
    </div>
    <p class="muted">Os números são casas avançadas, não pontos acumulados.</p>
    <h3>Casas e regras especiais</h3>
    <ul class="rules">
      <li><b>🎁 Casa Surpresa:</b> avance 3 casas, volte 2, escolha um adversário para responder uma pergunta, perca uma rodada ou ganhe uma pergunta extra (acertando, avança 3 casas).</li>
      <li><b>🏴‍☠️ Roubo de vez:</b> se você errar, os outros jogadores podem responder. Quem acertar primeiro avança 2 casas. Você fica onde estava.</li>
      <li><b>🚀 Avanço especial:</b> 3 acertos seguidos sem usar dicas rendem mais 2 casas.</li>
      <li><b>❤️ Orgulho de ser alagoano:</b> cumpra um desafio sobre Alagoas e avance 15 casas. Se não conseguir, fica na mesma casa.</li>
    </ul>
    <h3>Chegada</h3>
    <p>Vence quem alcançar ou ultrapassar a última casa. Não precisa chegar exatamente: se o avanço passar da chegada, o jogo termina na hora.</p>
    <h3>Jogando online</h3>
    <p>Uma pessoa cria a sala e passa o código. Os outros entram com o código. O anfitrião é o mediador: ele confere as respostas e vê a resposta correta.</p>`;

  const SOBRE = `
    <h2>Sobre o jogo</h2>
    <p><b>Alagoas: Arte que Encanta</b> é um jogo de tabuleiro educativo que celebra a cultura, a história e as belezas de Alagoas. Esta é a versão digital do jogo físico, para 2 a 4 jogadores, a partir de 10 anos, com partidas de cerca de 30 a 60 minutos.</p>
    <p>São 4 categorias com 15 cartas cada (60 no total): Gastronomia Alagoana, Música (com destaque para Djavan), Artesanato e Dança. O tabuleiro tem 50 casas em percurso oval: 40 de categoria, 10 de cada, mais as casas especiais.</p>
    <p class="quote">“${C.FRASE}”</p>`;

  async function menuModal() {
    const opcoes = [{ label: "Continuar jogando", v: "voltar", cls: "btn-primary" }];
    if (MODE !== "client") opcoes.push({ label: "Nova partida (mesmos jogadores)", v: "novo", cls: "btn-ghost" });
    opcoes.push({ label: MODE === "local" ? "Voltar ao início" : "Sair da sala", v: "sair", cls: "btn-ghost" });
    const v = await choiceModal({
      icone: "☰", titulo: "Menu",
      texto: MODE === "local" ? "A partida fica salva neste aparelho." : MODE === "host" ? "Se você sair, a sala é encerrada para todos." : "Você pode voltar à sala se o anfitrião continuar com ela aberta.",
      opcoes
    });
    if (v === "novo") novaPartida();
    else if (v === "sair") leaveToHome();
  }

  function novaPartida() {
    if (!HOST) return;
    const S = HOST.S;
    const players = S.pl.map((p) => ({ n: p.n, p: p.p, u: p.u }));
    if (MODE === "local") startLocal(players, true);
    else startOnlineGame(players, { sortear: true, med: S.med });
  }

  /* ============ EVENTOS ============ */
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b && !b.closest(".overlay")) {
      const a = b.dataset.act;
      if (a === "jogar") { UI.setup = newSetup(); renderSetup(); }
      else if (a === "online") { UI.on = newOnline(); renderOnlineMenu(); }
      else if (a === "continuar") resumeLocal();
      else if (a === "regras") textModal(COMO_JOGAR);
      else if (a === "sobre") textModal(SOBRE);
      else if (a === "inicio") leaveToHome();
      else if (a === "n") { UI.setup.n = +b.dataset.n; fixPawns(); renderSetup(); }
      else if (a === "peao") { UI.setup.players[+b.dataset.i].peao = b.dataset.p; renderSetup(); }
      else if (a === "comecar") {
        const S = UI.setup;
        startLocal(S.players.slice(0, S.n).map((p, i) => ({ n: (p.nome || "").trim() || `Jogador ${i + 1}`, p: p.peao })), S.sortear);
      }
      else if (a === "menu") menuModal();
      else if (a === "cat") dispatch("cat", { c: b.dataset.cat });
      else if (a === "tab") { UI.on.tab = b.dataset.tab; UI.on.err = ""; renderOnlineMenu(); }
      else if (a === "onpeao") { UI.on.peao = b.dataset.p; renderOnlineMenu(); }
      else if (a === "criarsala") criarSala();
      else if (a === "entrarsala") entrarSala();
      else if (a === "retomarsala") retomarSala();
      else if (a === "sairsala") { leaveToHome(); }
      else if (a === "iniciaronline") {
        if (ONL && ONL.roster.length >= 2) startOnlineGame(ONL.roster.map((s) => ({ n: s.n, p: s.p, u: s.u })), { sortear: UI.sortear, med: ONL.med });
      }
      else if (a === "copiar") copyCode();
      return;
    }
    const d = e.target.closest("#modal-root [data-a]");
    if (!d) return;
    const a = d.dataset.a;
    const S = VIEW;
    if (!S) return;
    if (a === "dica") dispatch("dica");
    else if (a === "conf") dispatch("conf", { tx: UI.tx });
    else if (a === "tenta") dispatch("tenta", { tx: UI.tx });
    else if (a === "ver") { UI.ver = !UI.ver; UI.keepFocus = true; renderPhase(); UI.keepFocus = false; }
    else if (a === "falar") {
      const ph = S.ph, c = CARTAS[ph.cat][ph.idx];
      speak([c[0]].concat([c[1], c[2]].slice(0, ph.d)).join(" "));
    }
    else if (a === "acertou") dispatch("julga", { ok: true });
    else if (a === "errou") dispatch("julga", { ok: false });
    else if (a === "rouba") dispatch("rouba", { i: +d.dataset.i });
    else if (a === "ninguem") dispatch("rouba", { i: null });
    else if (a === "cont") dispatch("cont");
    else if (a === "opp") dispatch("opp", { i: +d.dataset.i });
    else if (a === "orgok") dispatch("julga", { ok: true });
    else if (a === "orgno") dispatch("julga", { ok: false });
    else if (a === "novo") novaPartida();
    else if (a === "sair") leaveToHome();
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (!t) return;
    if (t.classList && t.classList.contains("input") && t.dataset.i != null && UI.setup) UI.setup.players[+t.dataset.i].nome = t.value;
    else if (t.id === "on-nome" && UI.on) UI.on.nome = t.value;
    else if (t.id === "on-code" && UI.on) UI.on.code = t.value;
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "sortear" && UI.setup) UI.setup.sortear = t.checked;
    else if (t.id === "on-med" && UI.on) UI.on.med = t.checked;
    else if (t.id === "sortear-on") UI.sortear = t.checked;
  });

  function fixPawns() {
    const S = UI.setup, used = new Set();
    S.players.slice(0, S.n).forEach((p) => {
      if (used.has(p.peao)) p.peao = C.PEOES.find((x) => !used.has(x.id) && !S.players.slice(0, S.n).some((q) => q !== p && q.peao === x.id)).id;
      used.add(p.peao);
    });
  }

  function copyCode() {
    if (!ONL) return;
    const code = ONL.code.toUpperCase();
    const fallback = () => {
      const el = $("#room-code");
      if (el && window.getSelection) {
        const r = document.createRange(); r.selectNodeContents(el);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      toast("Selecione e copie o código");
    };
    try {
      navigator.clipboard.writeText(code).then(() => toast("Código copiado"), fallback);
    } catch (e) { fallback(); }
  }

  /* ---------- verificação básica dos dados ---------- */
  C.ORDEM_CATEGORIAS.forEach((k) => {
    if (CARTAS[k].length !== 15) console.warn("Categoria " + k + " não tem 15 cartas:", CARTAS[k].length);
  });

  A.debug = { get HOST() { return HOST; }, get VIEW() { return VIEW; }, get ME() { return ME; }, get ONL() { return ONL; }, dispatch, get MODE() { return MODE; } };
  renderHome();
})();

</script>
